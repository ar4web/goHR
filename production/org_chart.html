<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="nav.hr-org">Org chart | HRGO</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="org" data-breadcrumb="Home > Org chart">

<main class="main">
<div class="page-wrapper" data-hr-org>

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle" data-i18n="hr.ui.pretitle">HR &amp; Operations</div>
        <h1 class="page-title" data-i18n="hr.nav.org">Org chart</h1>
      </div>
      <div class="page-actions">
        <span style="align-self:center;font-size:12.5px;color:var(--text-muted)" id="org-count"></span>
        <button class="btn btn-outline" id="org-import" data-i18n="common.import">Import</button>
        <button class="btn btn-outline" id="org-print" data-i18n="common.print">Print</button>
      </div>
    </div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-header"><div class="card-title" data-i18n="hr.org.tree">Reporting tree</div></div>
    <div class="card-body org-scroll" id="org-tree"></div>
  </div>

  <div class="card">
    <div class="card-header"><div class="card-title" data-i18n="hr.org.depts">Departments</div></div>
    <div class="card-body" id="org-depts"></div>
  </div>

</div>
</main>

<script type="module">
import { initOrgChart } from '/src/v4/org-chart.js';
initOrgChart();
</script>

</body>
</html>
