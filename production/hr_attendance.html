<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="nav.hr-attendance">Attendance | HRGO</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="hr-attendance" data-breadcrumb="Home > Attendance">

<main class="main">
<div class="page-wrapper" data-hr-attendance>

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle" data-i18n="hr.ui.pretitle">HR &amp; Operations</div>
        <h1 class="page-title" data-i18n="nav.hr-attendance">Attendance</h1>
      </div>
      <div class="page-actions">
        <button class="btn btn-outline" id="att-import" data-i18n="common.import">Import</button>
        <button class="btn btn-outline" id="att-export" data-i18n="common.export">Export</button>
        <button class="btn btn-primary" id="att-checkin" data-i18n="hr.p2.checkin">Check-in</button>
      </div>
    </div>
  </div>

  <div class="hr-stat-cards">
    <div class="hr-stat"><div class="k" data-i18n="hr.p2.present">Present</div><div class="v" id="att-stat-present">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="hr.p2.late">Late</div><div class="v" id="att-stat-late">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="hr.p2.absent">Absent</div><div class="v" id="att-stat-absent">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="hr.p2.ot">Overtime</div><div class="v" id="att-stat-ot">0:00</div></div>
  </div>

  <div class="card">
    <div class="card-header" style="gap:12px;flex-wrap:wrap">
      <div class="card-title"><span data-i18n="hr.p2.dayBoard">Day board</span> · <span id="att-day-label"></span></div>
      <div class="card-options" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <span id="att-cap"></span>
        <input type="date" class="form-control" id="att-day" dir="ltr" aria-label="Day">
        <select class="form-control" id="att-site" aria-label="Site"></select>
      </div>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table hr-table">
          <thead><tr>
            <th data-i18n="hr.p2.worker">Worker</th>
            <th data-i18n="hr.p2.site">Site</th>
            <th data-i18n="hr.p2.checkIn">Check-in</th>
            <th data-i18n="hr.p2.checkOut">Check-out</th>
            <th data-i18n="hr.p2.hours">Hours</th>
            <th data-i18n="hr.p2.ot">Overtime</th>
            <th data-i18n="common.status">Status</th>
            <th data-i18n="common.actions">Actions</th>
          </tr></thead>
          <tbody id="att-rows"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>
</main>

<script type="module">
import { initAttendance } from '/src/v4/attendance.js';
initAttendance();
</script>

</body>
</html>
