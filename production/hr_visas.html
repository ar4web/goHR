<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="nav.hr-visas">Visas | Dash</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="hr-visas" data-breadcrumb="Home > Visas">

<main class="main">
<div class="page-wrapper" data-hr-visas>

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle" data-i18n="hr.ui.pretitle">HR &amp; Operations</div>
        <h1 class="page-title" data-i18n="hr.nav.visas">Visas</h1>
      </div>
      <div class="page-actions">
        <button class="btn btn-outline" id="visa-import" data-i18n="common.import">Import</button>
        <button class="btn btn-primary" id="visa-export" data-i18n="common.export">Export</button>
      </div>
    </div>
  </div>

  <div class="row col-3" style="margin-bottom:16px">
    <div class="card"><div class="stat"><div class="stat-content"><div class="stat-label" data-i18n="hr.visas.blocks">Visa blocks</div><div class="stat-value-row"><span class="stat-value" id="visa-stat-blocks">0</span></div></div></div></div>
    <div class="card"><div class="stat"><div class="stat-content"><div class="stat-label" data-i18n="hr.visas.quota">Quota</div><div class="stat-value-row"><span class="stat-value" id="visa-stat-quota">0</span></div></div></div></div>
    <div class="card"><div class="stat"><div class="stat-content"><div class="stat-label" data-i18n="hr.visas.used">Used</div><div class="stat-value-row"><span class="stat-value" id="visa-stat-used">0</span></div></div></div></div>
    <div class="card"><div class="stat"><div class="stat-content"><div class="stat-label" data-i18n="hr.visas.avail">Available</div><div class="stat-value-row"><span class="stat-value" id="visa-stat-avail">0</span></div></div></div></div>
    <div class="card"><div class="stat"><div class="stat-content"><div class="stat-label" data-i18n="status.awaiting">Awaiting entry</div><div class="stat-value-row"><span class="stat-value" id="visa-stat-awaiting">0</span></div></div></div></div>
    <div class="card"><div class="stat"><div class="stat-content"><div class="stat-label" data-i18n="hr.visas.expiring">Expiring ≤ 90d</div><div class="stat-value-row"><span class="stat-value" id="visa-stat-expiring">0</span></div></div></div></div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-header"><div class="card-title" data-i18n="hr.visas.blocks">Visa blocks</div></div>
    <div class="card-body" id="visa-blocks"></div>
  </div>

  <div class="card">
    <div class="card-header" style="gap:12px;flex-wrap:wrap">
      <div class="card-title" data-i18n="hr.visas.register">Visa register</div>
      <div class="card-options">
        <select class="form-control" id="visa-status" style="width:170px" aria-label="Filter by status">
          <option value="" data-i18n="hr.employees.allStatus">All statuses</option>
          <option value="used" data-i18n="status.used">Used</option>
          <option value="awaiting" data-i18n="status.awaiting">Awaiting entry</option>
          <option value="expired" data-i18n="status.expired">Expired</option>
          <option value="cancelled" data-i18n="status.cancelled">Cancelled</option>
        </select>
      </div>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th data-i18n="hr.visas.visa">Visa</th>
              <th data-i18n="hr.visas.worker">Worker</th>
              <th data-i18n="hr.visas.profession">Profession</th>
              <th data-i18n="hr.visas.issued">Issued</th>
              <th data-i18n="hr.visas.validUntil">Valid until</th>
              <th data-i18n="hr.visas.entry">Entry</th>
              <th data-i18n="common.status">Status</th>
              <th><span class="sr-only" data-i18n="common.actions">Actions</span></th>
            </tr>
          </thead>
          <tbody id="visa-rows"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>
</main>

<script type="module">
import { initVisas } from '/src/v4/visas.js';
initVisas();
</script>

</body>
</html>
