<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="nav.hr-roles">Roles &amp; access | Dash</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="hr-roles" data-breadcrumb="Home > Roles & access">

<main class="main">
<div class="page-wrapper" data-hr-roles>

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle" data-i18n="hr.ui.pretitle">HR &amp; Operations</div>
        <h1 class="page-title" data-i18n="nav.hr-roles">Roles &amp; access</h1>
        <p class="hr-note">🔒 <span data-i18n="hr.p6.uxOnly">Display only — the server always re-checks permissions.</span></p>
      </div>
      <div class="page-actions">
        <button class="btn btn-outline" id="ro-reset">↺</button>
        <button class="btn btn-primary" id="ro-save" data-i18n="hr.p6.savePerms">Save permissions</button>
      </div>
    </div>
  </div>

  <div class="hr-stat-cards">
    <div class="hr-stat"><div class="k" data-i18n="hr.p6.role">Role</div><div class="v" id="ro-stat-total">0</div></div>
    <div class="hr-stat"><div class="k">⚙ <span data-i18n="hr.p6.custom">Custom</span></div><div class="v" id="ro-stat-custom">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="hr.p6.previewAs">Preview sidebar as</div><div class="v" id="ro-stat-view">admin</div></div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="form-group" style="max-width:320px">
        <label class="form-label" for="ro-preview" data-i18n="hr.p6.previewAs">Preview sidebar as</label>
        <select class="form-control" id="ro-preview"></select>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table hr-table" id="ro-matrix"></table>
      </div>
    </div>
  </div>

</div>
</main>

<script type="module">
import { initRoles } from '/src/v4/roles.js';
initRoles();
</script>

</body>
</html>
