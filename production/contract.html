<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="nav.hr-contracts">Contract | HRGO</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="contract-detail" data-breadcrumb="Home > Contract maker > Contract">

<main class="main">
<div class="page-wrapper" data-hr-contract>

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle" data-i18n="hr.ui.pretitle">HR &amp; Operations</div>
        <h1 class="page-title" id="cd-title">Contract</h1>
      </div>
      <div class="page-actions">
        <a class="btn btn-outline" href="contracts.html" data-i18n="hr.p5.back">Back</a>
        <button class="btn btn-outline" id="cd-sign-btn" data-i18n="hr.p5.signBtn">Sign ✓</button>
        <button class="btn btn-outline" id="cd-file-btn" data-i18n="hr.p5.file">File</button>
        <button class="btn btn-primary" id="cd-print" data-i18n="common.print">Print</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="hr-form-2col" style="font-size:12.5px">
        <div><strong data-i18n="hr.p5.party">Party</strong>: <span id="cd-party"></span></div>
        <div><strong data-i18n="hr.p5.period">Period</strong>: <span id="cd-period"></span></div>
        <div><strong data-i18n="common.status">Status</strong>: <span id="cd-status"></span></div>
        <div><strong data-i18n="hr.p5.sign">Sign</strong>: <span id="cd-sign"></span></div>
        <div><strong data-i18n="hr.p5.tplVer">Template</strong>: <span id="cd-ver" dir="ltr"></span></div>
        <div><strong data-i18n="hr.p5.qiwa">Qiwa</strong>: <span id="cd-qiwa" dir="ltr"></span></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-body" id="cd-doc"></div>
  </div>

</div>
</main>

<script type="module">
import { initContract } from '/src/v4/contract.js';
initContract();
</script>

</body>
</html>
