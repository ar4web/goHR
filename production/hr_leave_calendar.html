<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="nav.hr-leave-calendar">Leave calendar | Dash</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="hr-leave-calendar" data-breadcrumb="Home > Leave calendar">

<main class="main">
<div class="page-wrapper" data-hr-leavecal>

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle" data-i18n="hr.ui.pretitle">HR &amp; Operations</div>
        <h1 class="page-title" data-i18n="nav.hr-leave-calendar">Leave calendar</h1>
      </div>
      <div class="page-actions">
        <button class="btn btn-outline" id="lc-prev" aria-label="Previous month">‹</button>
        <button class="btn btn-outline" id="lc-today" data-i18n="hr.p2.today">Today</button>
        <button class="btn btn-outline" id="lc-next" aria-label="Next month">›</button>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="card" style="flex:2;min-width:0">
      <div class="card-header"><div class="card-title" id="lc-label">—</div></div>
      <div class="card-body">
        <div id="lc-grid"></div>
        <div class="lc-legend">
          <span><span class="lc-dot lc-dot-h"></span> <span data-i18n="hr.p2.holiday">Holiday</span></span>
          <span><span class="lc-dot lc-dot-a"></span> <span data-i18n="status.approved">Approved</span></span>
          <span><span class="lc-dot lc-dot-p"></span> <span data-i18n="status.pending">Pending</span></span>
        </div>
      </div>
    </div>
    <div class="card" style="flex:1;min-width:260px">
      <div class="card-header"><div class="card-title" data-i18n="hr.p2.dayDetail">Day detail</div></div>
      <div class="card-body" id="lc-detail"></div>
    </div>
  </div>

</div>
</main>

<script type="module">
import { initLeaveCalendar } from '/src/v4/leave-calendar.js';
initLeaveCalendar();
</script>

</body>
</html>
