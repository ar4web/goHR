<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="nav.hr-requests">Manpower requests | HRGO</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="hr-requests" data-breadcrumb="Home > Manpower requests">

<main class="main">
<div class="page-wrapper" data-hr-requests>

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle" data-i18n="hr.ui.pretitle">HR &amp; Operations</div>
        <h1 class="page-title" data-i18n="nav.hr-requests">Manpower requests</h1>
      </div>
      <div class="page-actions">
        <button class="btn btn-outline" id="rq-import" data-i18n="common.import">Import</button>
        <button class="btn btn-outline" id="rq-export" data-i18n="common.export">Export</button>
        <button class="btn btn-primary" id="rq-new" data-i18n="hr.p2.newRequest">New request</button>
      </div>
    </div>
  </div>

  <div class="hr-stat-cards">
    <div class="hr-stat"><div class="k" data-i18n="hr.p3.openReqs">Open reqs</div><div class="v" id="rq-stat-open">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="hr.p2.headcount">Headcount</div><div class="v" id="rq-stat-qty">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="hr.p3.filled">Filled</div><div class="v" id="rq-stat-filled">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="hr.p3.fulfilled">Fulfilled</div><div class="v" id="rq-stat-done">0</div></div>
  </div>

  <div class="card">
    <div class="card-header"><div class="card-title" data-i18n="hr.p3.pipeline">Pipeline</div></div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table hr-table">
          <thead><tr>
            <th>#</th>
            <th data-i18n="hr.p2.site">Site</th>
            <th data-i18n="hr.p3.profession">Profession</th>
            <th data-i18n="hr.p3.filled">Filled</th>
            <th data-i18n="hr.p3.rate">Rate</th>
            <th data-i18n="hr.p3.start">Start</th>
            <th data-i18n="common.status">Status</th>
            <th data-i18n="common.actions">Actions</th>
          </tr></thead>
          <tbody id="rq-rows"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>
</main>

<script type="module">
import { initRequests } from '/src/v4/requests.js';
initRequests();
</script>

</body>
</html>
