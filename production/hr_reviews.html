<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="nav.hr-reviews">Reviews | Dash</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="hr-reviews" data-breadcrumb="Home > Reviews">

<main class="main">
<div class="page-wrapper" data-hr-reviews>

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle" data-i18n="hr.ui.pretitle">HR &amp; Operations</div>
        <h1 class="page-title" data-i18n="nav.hr-reviews">Reviews</h1>
      </div>
      <div class="page-actions">
        <button class="btn btn-outline" id="rv-export-xlsx">Excel</button>
        <button class="btn btn-outline" id="rv-export-csv">CSV</button>
        <button class="btn btn-primary" id="rv-new" data-i18n="hr.p6.newReview">New review</button>
      </div>
    </div>
  </div>

  <div class="hr-stat-cards">
    <div class="hr-stat"><div class="k" data-i18n="hr.p6.inCycle">In cycle</div><div class="v" id="rv-stat-cycle">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="hr.p6.published">Published</div><div class="v" id="rv-stat-pub">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="hr.p6.avgFinal">Avg final</div><div class="v" id="rv-stat-avg">—</div></div>
    <div class="hr-stat"><div class="k" data-i18n="hr.p6.acked">Acknowledged</div><div class="v" id="rv-stat-ack">0</div></div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table hr-table">
          <thead><tr>
            <th>#</th>
            <th data-i18n="hr.p6.employee">Employee</th>
            <th data-i18n="hr.p6.cycle">Cycle</th>
            <th data-i18n="hr.p6.self">Self</th>
            <th data-i18n="hr.p6.manager">Manager</th>
            <th data-i18n="hr.p6.final">Final</th>
            <th data-i18n="common.status">Status</th>
            <th data-i18n="common.actions">Actions</th>
          </tr></thead>
          <tbody id="rv-rows"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>
</main>

<script type="module">
import { initReviews } from '/src/v4/reviews.js';
initReviews();
</script>

</body>
</html>
