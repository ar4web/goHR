<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="nav.hr-trainings">Trainings | HRGO</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="hr-trainings" data-breadcrumb="Home > Trainings">

<main class="main">
<div class="page-wrapper" data-hr-trainings>

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle" data-i18n="hr.ui.pretitle">HR &amp; Operations</div>
        <h1 class="page-title" data-i18n="nav.hr-trainings">Trainings</h1>
      </div>
      <div class="page-actions">
        <button class="btn btn-outline" id="tr-export-xlsx">Excel</button>
        <button class="btn btn-outline" id="tr-export-evidence" data-i18n="hr.p6.evidence">Evidence CSV</button>
        <button class="btn btn-primary" id="tr-new" data-i18n="hr.p6.newTraining">New training</button>
      </div>
    </div>
  </div>

  <div class="hr-stat-cards">
    <div class="hr-stat"><div class="k" data-i18n="hr.p6.planned">Planned</div><div class="v" id="tr-stat-planned">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="hr.p6.done">Done</div><div class="v" id="tr-stat-done">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="hr.p6.attendeeHours">Attendee-hours</div><div class="v" id="tr-stat-hours">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="hr.p6.spend">Spend (SAR)</div><div class="v" id="tr-stat-spend">0</div></div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table hr-table">
          <thead><tr>
            <th>#</th>
            <th data-i18n="hr.p6.course">Course</th>
            <th data-i18n="hr.p6.date">Date</th>
            <th data-i18n="hr.p6.hours">Hours</th>
            <th data-i18n="hr.p6.cost">Cost</th>
            <th data-i18n="common.status">Status</th>
            <th data-i18n="common.actions">Actions</th>
          </tr></thead>
          <tbody id="tr-rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header"><h2 data-i18n="hr.p6.topTrained">Most trained (done only)</h2></div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table hr-table">
          <thead><tr>
            <th data-i18n="hr.p6.employee">Employee</th>
            <th data-i18n="hr.p6.hours">Hours</th>
          </tr></thead>
          <tbody id="tr-rollup"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>
</main>

<script type="module">
import { initTrainings } from '/src/v4/trainings.js';
initTrainings();
</script>

</body>
</html>
