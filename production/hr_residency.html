<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="nav.hr-residency">Residency &amp; renewals | HRGO</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="hr-residency" data-breadcrumb="Home > Residency &amp; renewals">

<main class="main">
<div class="page-wrapper" data-hr-residency>

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle" data-i18n="hr.ui.pretitle">HR &amp; Operations</div>
        <h1 class="page-title" data-i18n="hr.nav.residency">Residency &amp; renewals</h1>
      </div>
      <div class="page-actions">
        <button class="btn btn-outline" id="res-import" data-i18n="common.import">Import</button>
        <button class="btn btn-primary" id="res-export" data-i18n="common.export">Export</button>
      </div>
    </div>
  </div>

  <div class="row col-3" style="margin-bottom:16px">
    <div class="card"><div class="stat"><div class="stat-content"><div class="stat-label" data-i18n="hr.residency.total">Expats tracked</div><div class="stat-value-row"><span class="stat-value" id="res-stat-total">0</span></div></div></div></div>
    <div class="card"><div class="stat"><div class="stat-content"><div class="stat-label" data-i18n="hr.residency.iqamaDue">Iqama due ≤ 30d</div><div class="stat-value-row"><span class="stat-value" id="res-stat-iqama">0</span></div></div></div></div>
    <div class="card"><div class="stat"><div class="stat-content"><div class="stat-label" data-i18n="hr.residency.insBad">Insurance issues</div><div class="stat-value-row"><span class="stat-value" id="res-stat-ins">0</span></div></div></div></div>
    <div class="card"><div class="stat"><div class="stat-content"><div class="stat-label" data-i18n="hr.residency.tblFines">Open fines</div><div class="stat-value-row"><span class="stat-value" id="res-stat-fines">0</span></div></div></div></div>
    <div class="card"><div class="stat"><div class="stat-content"><div class="stat-label" data-i18n="hr.residency.tblReady">Renewal-ready</div><div class="stat-value-row"><span class="stat-value" id="res-stat-ready">0</span></div></div></div></div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-header"><div class="card-title" data-i18n="hr.residency.board">Expiry board</div></div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th data-i18n="hr.residency.worker">Worker</th>
              <th data-i18n="hr.residency.iqama">Iqama</th>
              <th data-i18n="hr.residency.passport">Passport</th>
              <th data-i18n="hr.residency.insurance">Insurance</th>
              <th data-i18n="hr.residency.tblFines">Fines</th>
              <th data-i18n="hr.residency.tblReady">Ready</th>
              <th><span class="sr-only" data-i18n="common.actions">Actions</span></th>
            </tr>
          </thead>
          <tbody id="res-rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-header"><div class="card-title" data-i18n="hr.residency.file">Renewal file</div></div>
    <div class="card-body" id="res-detail"></div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="card-title" data-i18n="hr.residency.transfers">Qiwa transfer cases</div>
      <div class="card-options">
        <button class="btn btn-primary btn-sm" id="res-transfer-new" data-i18n="hr.residency.newTransfer">New case</button>
      </div>
    </div>
    <div class="card-body" id="res-transfers"></div>
  </div>

</div>
</main>

<script type="module">
import { initResidency } from '/src/v4/residency.js';
initResidency();
</script>

</body>
</html>
