<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="nav.hr-jobs">Jobs | Dash</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="hr-jobs" data-breadcrumb="Home > Jobs">

<main class="main">
<div class="page-wrapper" data-hr-jobs>

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle" data-i18n="hr.ui.pretitle">HR &amp; Operations</div>
        <h1 class="page-title" data-i18n="nav.hr-jobs">Jobs</h1>
      </div>
      <div class="page-actions">
        <button class="btn btn-outline" id="jb-export-xlsx">Excel</button>
        <button class="btn btn-outline" id="jb-export-csv">CSV</button>
        <button class="btn btn-primary" id="jb-new" data-i18n="hr.p5.newReq">New requisition</button>
      </div>
    </div>
  </div>

  <div class="hr-stat-cards">
    <div class="hr-stat"><div class="k" data-i18n="hr.p5.openJobs">Open jobs</div><div class="v" id="jb-stat-open">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="hr.p5.openHc">Open headcount</div><div class="v" id="jb-stat-hc">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="hr.p5.filled">Filled</div><div class="v" id="jb-stat-filled">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="hr.p5.drafts">Drafts</div><div class="v" id="jb-stat-draft">0</div></div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table hr-table">
          <thead><tr>
            <th>#</th>
            <th data-i18n="hr.p5.title">Title</th>
            <th data-i18n="hr.p5.headcount">Headcount</th>
            <th data-i18n="hr.p5.salary">Salary</th>
            <th data-i18n="hr.p5.site">Site</th>
            <th data-i18n="common.status">Status</th>
            <th data-i18n="common.actions">Actions</th>
          </tr></thead>
          <tbody id="jb-rows"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>
</main>

<script type="module">
import { initJobs } from '/src/v4/jobs.js';
initJobs();
</script>

</body>
</html>
