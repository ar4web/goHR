<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="nav.hr-contracts">Contract maker | HRGO</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="contracts" data-breadcrumb="Home > Contract maker">

<main class="main">
<div class="page-wrapper" data-hr-contracts>

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle" data-i18n="hr.ui.pretitle">HR &amp; Operations</div>
        <h1 class="page-title" data-i18n="nav.hr-contracts">Contract maker</h1>
      </div>
      <div class="page-actions">
        <button class="btn btn-outline" id="ct-export-xlsx">Excel</button>
        <button class="btn btn-outline" id="ct-export-csv">CSV</button>
        <button class="btn btn-primary" id="ct-new" data-i18n="hr.p5.newContract">New document</button>
      </div>
    </div>
  </div>

  <div class="hr-stat-cards">
    <div class="hr-stat"><div class="k" data-i18n="hr.p5.active">Active</div><div class="v" id="ct-stat-active">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="hr.p5.expiring90">Expiring ≤ 90d</div><div class="v" id="ct-stat-exp">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="hr.p5.awaitingSign">Awaiting signature</div><div class="v" id="ct-stat-sign">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="hr.p5.drafts">Drafts</div><div class="v" id="ct-stat-draft">0</div></div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="form-group" style="max-width:260px"><label class="form-label" for="ct-cat" data-i18n="hr.p5.category">Category</label>
        <select class="form-control" id="ct-cat">
          <option value="all" data-i18n="hr.p5.all">All</option>
          <option value="E" data-i18n="hr.p5.empContracts">Employee contracts</option>
          <option value="A" data-i18n="hr.p5.assignDocs">Assignment docs</option>
          <option value="C" data-i18n="hr.p5.clientAgmts">Client agreements</option>
          <option value="L" data-i18n="hr.p5.hrLetters">HR letters</option>
        </select></div>
      <div class="table-responsive">
        <table class="table hr-table">
          <thead><tr>
            <th>#</th>
            <th data-i18n="hr.p5.type">Type</th>
            <th data-i18n="hr.p5.party">Party</th>
            <th data-i18n="hr.p5.period">Period</th>
            <th data-i18n="hr.p5.expiry">Expiry</th>
            <th data-i18n="common.status">Status</th>
            <th data-i18n="hr.p5.sign">Sign</th>
            <th data-i18n="common.actions">Actions</th>
          </tr></thead>
          <tbody id="ct-rows"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>
</main>

<script type="module">
import { initContracts } from '/src/v4/contracts.js';
initContracts();
</script>

</body>
</html>
