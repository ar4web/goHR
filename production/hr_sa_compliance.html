<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="nav.hr-sa-compliance">SA Compliance | Dash</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;400;500;600;700&display=swap" rel="stylesheet"></noscript>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="hr-sa-compliance" data-breadcrumb="Home > SA Compliance">

<main class="main">
<div class="page-wrapper" data-hr-compliance>

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle" data-i18n="hr.ui.pretitle">HR &amp; Operations</div>
        <h1 class="page-title" data-i18n="hr.nav.compliance">SA Compliance</h1>
      </div>
      <div class="page-actions">
        <button class="btn btn-primary" id="cmp-export" data-i18n="common.export">Export</button>
      </div>
    </div>
  </div>

  <div class="row col-2" style="margin-bottom:16px">
    <div class="card"><div class="stat"><div class="stat-icon red"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2l8 3v6c0 5-3.5 9.5-8 11-4.5-1.5-8-6-8-11V5l8-3z"/><path d="M9 12l2 2 4-4"/></svg></div><div class="stat-content"><div class="stat-label" data-i18n="hr.compliance.blocked">Blocked deployments</div><div class="stat-value-row"><span class="stat-value" id="cmp-stat-blocked">0</span></div></div></div></div>
    <div class="card"><div class="stat"><div class="stat-icon yellow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M8 4v6M16 4v6"/></svg></div><div class="stat-content"><div class="stat-label" data-i18n="hr.compliance.iqama30">Iqama ≤ 30 days</div><div class="stat-value-row"><span class="stat-value" id="cmp-stat-iqama">0</span></div></div></div></div>
    <div class="card"><div class="stat"><div class="stat-icon blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8"/></svg></div><div class="stat-content"><div class="stat-label" data-i18n="hr.compliance.qiwaPending">Qiwa not authenticated</div><div class="stat-value-row"><span class="stat-value" id="cmp-stat-qiwa">0</span></div></div></div></div>
    <div class="card"><div class="stat"><div class="stat-icon green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/></svg></div><div class="stat-content"><div class="stat-label" data-i18n="hr.employees.saudRate">Saudization (est.)</div><div class="stat-value-row"><span class="stat-value" id="cmp-stat-saud">0%</span></div></div></div></div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="hr-tabs" id="cmp-tabs" role="tablist"></div>
    </div>
  </div>

  <div class="card" style="margin-top:12px">
    <div class="card-body">
      <div id="cmp-body"></div>
    </div>
  </div>

</div>
</main>

<script type="module">
import { initCompliance } from '/src/v4/compliance.js';
initCompliance();
</script>

</body>
</html>
