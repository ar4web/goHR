<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="nav.hr-expenses">Expenses | HRGO</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="hr-expenses" data-breadcrumb="Home > Expenses">

<main class="main">
<div class="page-wrapper" data-hr-expenses>

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle" data-i18n="hr.ui.pretitle">HR &amp; Operations</div>
        <h1 class="page-title" data-i18n="nav.hr-expenses">Expenses</h1>
      </div>
      <div class="page-actions">
        <button class="btn btn-outline" id="ex-export-xlsx">Excel</button>
        <button class="btn btn-outline" id="ex-export-csv">CSV</button>
        <button class="btn btn-outline" id="ex-export-vat" data-i18n="hr.p4.vatReport">VAT report</button>
        <button class="btn btn-outline" id="ex-import" data-i18n="common.import">Import</button>
        <button class="btn btn-primary" id="ex-new" data-i18n="hr.p4.newClaim">New claim</button>
      </div>
    </div>
  </div>

  <div class="hr-stat-cards">
    <div class="hr-stat"><div class="k" data-i18n="hr.p4.openClaims">Open claims</div><div class="v" id="ex-stat-open">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="hr.p4.openAmt">Open amount</div><div class="v" id="ex-stat-amt">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="hr.p4.vatReclaim">VAT reclaimable</div><div class="v" id="ex-stat-vat">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="hr.p4.billable">Billable</div><div class="v" id="ex-stat-bill">0</div></div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="form-group" style="max-width:260px"><label class="form-label" for="ex-status" data-i18n="common.status">Status</label>
        <select class="form-control" id="ex-status">
          <option value="all">—</option>
          <option value="draft" data-i18n="status.draft">Draft</option>
          <option value="submitted" data-i18n="status.submitted">Submitted</option>
          <option value="approved" data-i18n="status.approved">Approved</option>
          <option value="paid" data-i18n="status.paid">Paid</option>
          <option value="rejected" data-i18n="status.rejected">Rejected</option>
        </select></div>
      <div class="table-responsive">
        <table class="table hr-table">
          <thead><tr>
            <th>#</th>
            <th data-i18n="hr.p4.employee">Employee</th>
            <th data-i18n="hr.p4.category">Category</th>
            <th data-i18n="hr.p4.amount">Amount</th>
            <th data-i18n="hr.p4.receipt">Receipt</th>
            <th data-i18n="hr.p4.flags">Flags</th>
            <th data-i18n="common.status">Status</th>
            <th data-i18n="common.actions">Actions</th>
          </tr></thead>
          <tbody id="ex-rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="page-header-row" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px">
        <h3 class="card-title" style="margin:0" data-i18n="hr.p4.advances">Advances</h3>
        <button class="btn btn-outline" id="ad-new" data-i18n="hr.p4.newAdvance">New advance</button>
      </div>
      <div class="table-responsive">
        <table class="table hr-table">
          <thead><tr>
            <th>#</th>
            <th data-i18n="hr.p4.employee">Employee</th>
            <th data-i18n="hr.p4.purpose">Purpose</th>
            <th data-i18n="hr.p4.amount">Amount</th>
            <th data-i18n="hr.p4.balance">Balance</th>
            <th data-i18n="common.status">Status</th>
            <th data-i18n="common.actions">Actions</th>
          </tr></thead>
          <tbody id="ad-rows"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>
</main>

<script type="module">
import { initExpenses } from '/src/v4/expenses.js';
initExpenses();
</script>

</body>
</html>
