<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="nav.hr-timesheets">Timesheets | HRGO</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="timesheets" data-breadcrumb="Home > Timesheets">

<main class="main">
<div class="page-wrapper" data-hr-timesheets>

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle" data-i18n="hr.ui.pretitle">HR &amp; Operations</div>
        <h1 class="page-title" data-i18n="nav.hr-timesheets">Timesheets</h1>
      </div>
      <div class="page-actions">
        <button class="btn btn-outline" id="ts-import" data-i18n="common.import">Import</button>
        <button class="btn btn-outline" id="ts-export" data-i18n="common.export">Export</button>
        <button class="btn btn-primary" id="ts-new" data-i18n="hr.p2.newSheet">New sheet</button>
      </div>
    </div>
  </div>

  <div class="hr-stat-cards">
    <div class="hr-stat"><div class="k" data-i18n="status.draft">Draft</div><div class="v" id="ts-stat-draft">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="status.submitted">Submitted</div><div class="v" id="ts-stat-sub">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="status.approved">Approved</div><div class="v" id="ts-stat-appr">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="hr.p2.ot">Overtime</div><div class="v" id="ts-stat-ot">0h</div></div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table hr-table">
          <thead><tr>
            <th>#</th>
            <th data-i18n="hr.p2.site">Site</th>
            <th data-i18n="hr.p2.week">Week</th>
            <th data-i18n="hr.p2.regOt">Reg / OT</th>
            <th data-i18n="common.status">Status</th>
            <th data-i18n="common.open">Open</th>
          </tr></thead>
          <tbody id="ts-rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-body" id="ts-detail"></div>
  </div>

</div>
</main>

<script type="module">
import { initTimesheets } from '/src/v4/timesheets.js';
initTimesheets();
</script>

</body>
</html>
