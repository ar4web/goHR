<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="nav.hr-announcements">Announcements | Dash</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="hr-announcements" data-breadcrumb="Home > Announcements">

<main class="main">
<div class="page-wrapper" data-hr-announcements>

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle" data-i18n="hr.ui.pretitle">HR &amp; Operations</div>
        <h1 class="page-title" data-i18n="nav.hr-announcements">Announcements</h1>
      </div>
      <div class="page-actions">
        <button class="btn btn-outline" id="an-export-xlsx">Excel</button>
        <button class="btn btn-outline" id="an-export-csv">CSV</button>
        <button class="btn btn-primary" id="an-new" data-i18n="hr.p6.newAnn">New announcement</button>
      </div>
    </div>
  </div>

  <div class="hr-stat-cards">
    <div class="hr-stat"><div class="k" data-i18n="hr.p6.published">Published</div><div class="v" id="an-stat-pub">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="hr.p6.drafts">Drafts</div><div class="v" id="an-stat-draft">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="hr.p6.expired">Expired</div><div class="v" id="an-stat-exp">0</div></div>
  </div>

  <div class="hr-wall" id="an-list"></div>

</div>
</main>

<script type="module">
import { initAnnouncements } from '/src/v4/announcements.js';
initAnnouncements();
</script>

</body>
</html>
