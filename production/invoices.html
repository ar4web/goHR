<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="nav.hr-invoices">Invoices | HRGO</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="invoices" data-breadcrumb="Home > Invoices">

<main class="main">
<div class="page-wrapper" data-hr-invoices>

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle" data-i18n="hr.ui.pretitle">HR &amp; Operations</div>
        <h1 class="page-title" data-i18n="nav.hr-invoices">Invoices</h1>
      </div>
      <div class="page-actions">
        <button class="btn btn-outline" id="in-export" data-i18n="common.export">Export</button>
        <button class="btn btn-primary" id="in-new" data-i18n="hr.p3.generate">Generate</button>
      </div>
    </div>
  </div>

  <div class="hr-stat-cards">
    <div class="hr-stat"><div class="k" data-i18n="status.draft">Draft</div><div class="v" id="in-stat-draft">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="hr.p3.outstanding">Outstanding</div><div class="v" id="in-stat-out">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="status.overdue">Overdue</div><div class="v" id="in-stat-over">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="hr.p3.paidMonth">Paid this month</div><div class="v" id="in-stat-paidm">0</div></div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table hr-table">
          <thead><tr>
            <th>#</th>
            <th data-i18n="hr.p3.client">Client</th>
            <th data-i18n="hr.p3.lines">Lines</th>
            <th data-i18n="hr.p3.total">Total</th>
            <th data-i18n="hr.p3.due">Due</th>
            <th data-i18n="common.status">Status</th>
            <th data-i18n="common.actions">Actions</th>
          </tr></thead>
          <tbody id="in-rows"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>
</main>

<script type="module">
import { initInvoices } from '/src/v4/invoices.js';
initInvoices();
</script>

</body>
</html>
