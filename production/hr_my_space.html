<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="nav.hr-my-space">My space | Dash</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="hr-my-space" data-breadcrumb="Home > My space">

<main class="main">
<div class="page-wrapper" data-hr-myspace>

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle" data-i18n="hr.ui.pretitle">HR &amp; Operations</div>
        <h1 class="page-title" data-i18n="hr.nav.mySpace">My space</h1>
      </div>
      <div class="page-actions">
        <select class="form-control" id="my-who" aria-label="Switch employee" style="max-width:220px"></select>
        <button class="btn btn-outline" id="my-print" data-i18n="common.print">Print</button>
      </div>
    </div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-body">
      <div class="hr-360-top" id="my-head"></div>
    </div>
  </div>

  <div class="row col-2" style="margin-bottom:16px">
    <div class="card">
      <div class="card-header"><div class="card-title" data-i18n="hr.myspace.profile">Profile</div></div>
      <div class="card-body" id="my-profile"></div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title" data-i18n="hr.myspace.pay">This month's pay</div></div>
      <div class="card-body" id="my-pay"></div>
    </div>
  </div>

  <div class="row col-2" style="margin-bottom:16px">
    <div class="card">
      <div class="card-header"><div class="card-title" data-i18n="hr.myspace.deploy">My deployment</div></div>
      <div class="card-body" id="my-deploy"></div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title" data-i18n="hr.myspace.leave">Annual leave</div></div>
      <div class="card-body" style="text-align:center" id="my-leave"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-header"><div class="card-title" data-i18n="hr.myspace.requests">My requests</div></div>
    <div class="card-body" id="my-requests"></div>
  </div>

</div>
</main>

<script type="module">
import { initMySpace } from '/src/v4/my-space.js';
initMySpace();
</script>

</body>
</html>
