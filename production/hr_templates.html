<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="nav.hr-templates">Templates | HRGO</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="hr-templates" data-breadcrumb="Home > Templates">

<main class="main">
<div class="page-wrapper" data-hr-templates>

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle" data-i18n="hr.ui.pretitle">HR &amp; Operations</div>
        <h1 class="page-title" data-i18n="nav.hr-templates">Templates</h1>
      </div>
    </div>
  </div>

  <div class="hr-stat-cards">
    <div class="hr-stat"><div class="k" data-i18n="hr.p5.all">All</div><div class="v" id="tp-stat-n">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="hr.p5.empContracts">Employee contracts</div><div class="v" id="tp-stat-e">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="hr.p5.clientAgmts">Client agreements</div><div class="v" id="tp-stat-c">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="hr.p5.hrLetters">HR letters</div><div class="v" id="tp-stat-l">0</div></div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="form-group" style="max-width:260px"><label class="form-label" for="tp-cat" data-i18n="hr.p5.category">Category</label>
        <select class="form-control" id="tp-cat">
          <option value="all" data-i18n="hr.p5.all">All</option>
          <option value="E" data-i18n="hr.p5.empContracts">Employee contracts</option>
          <option value="A" data-i18n="hr.p5.assignDocs">Assignment docs</option>
          <option value="C" data-i18n="hr.p5.clientAgmts">Client agreements</option>
          <option value="L" data-i18n="hr.p5.hrLetters">HR letters</option>
        </select></div>
      <div class="table-responsive">
        <table class="table hr-table">
          <thead><tr>
            <th>#</th>
            <th data-i18n="hr.p5.name">Name</th>
            <th data-i18n="hr.p5.category">Category</th>
            <th data-i18n="hr.p5.version">Version</th>
            <th data-i18n="hr.p5.placeholders">Placeholders</th>
            <th data-i18n="hr.p5.updated">Updated</th>
            <th data-i18n="common.actions">Actions</th>
          </tr></thead>
          <tbody id="tp-rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <h3 class="card-title" data-i18n="hr.p5.refTitle">Placeholder reference</h3>
      <div id="tp-ref"></div>
    </div>
  </div>

</div>
</main>

<script type="module">
import { initTemplates } from '/src/v4/templates.js';
initTemplates();
</script>

</body>
</html>
