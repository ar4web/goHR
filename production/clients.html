<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="nav.hr-clients">Clients | HRGO</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="clients" data-breadcrumb="Home > Clients">

<main class="main">
<div class="page-wrapper" data-hr-clients>

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle" data-i18n="hr.ui.pretitle">HR &amp; Operations</div>
        <h1 class="page-title" data-i18n="nav.hr-clients">Clients</h1>
      </div>
      <div class="page-actions">
        <button class="btn btn-outline" id="cl-import" data-i18n="common.import">Import</button>
        <button class="btn btn-outline" id="cl-export" data-i18n="common.export">Export</button>
        <button class="btn btn-primary" id="cl-new" data-i18n="hr.p3.newClient">New client</button>
      </div>
    </div>
  </div>

  <div class="hr-stat-cards">
    <div class="hr-stat"><div class="k" data-i18n="hr.p3.clients">Clients</div><div class="v" id="cl-stat-count">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="hr.p3.deployed">Deployed</div><div class="v" id="cl-stat-deployed">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="hr.p3.openReqs">Open reqs</div><div class="v" id="cl-stat-open">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="hr.p3.runrate">Monthly run-rate</div><div class="v" id="cl-stat-runrate">0</div></div>
  </div>

  <div class="card">
    <div class="card-header"><div class="card-title" data-i18n="hr.p2.register">Register</div></div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table hr-table">
          <thead><tr>
            <th data-i18n="hr.p3.client">Client</th>
            <th data-i18n="hr.p3.city">City</th>
            <th data-i18n="hr.clients.nitaqat">Nitaqat</th>
            <th data-i18n="hr.clients.wps">WPS</th>
            <th data-i18n="hr.p3.sites">Sites</th>
            <th data-i18n="hr.p3.deployed">Deployed</th>
            <th data-i18n="hr.p3.openReqs">Open reqs</th>
            <th data-i18n="hr.p3.billingDay">Billing day</th>
            <th data-i18n="common.actions">Actions</th>
          </tr></thead>
          <tbody id="cl-rows"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>
</main>

<script type="module">
import { initClients } from '/src/v4/clients.js';
initClients();
</script>

</body>
</html>
