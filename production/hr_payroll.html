<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="nav.hr-payroll">Pay runs | Dash</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="hr-payroll" data-breadcrumb="Home > Pay runs">

<main class="main">
<div class="page-wrapper" data-hr-payroll>

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle" data-i18n="hr.ui.pretitle">HR &amp; Operations</div>
        <h1 class="page-title" data-i18n="nav.hr-payroll">Pay runs</h1>
      </div>
      <div class="page-actions">
        <button class="btn btn-outline" id="pr-export-xlsx">Excel</button>
        <button class="btn btn-outline" id="pr-export-csv">CSV</button>
        <button class="btn btn-outline" id="pr-approve" data-i18n="hr.p4.approve">Approve run</button>
        <button class="btn btn-primary" id="pr-pay" data-i18n="hr.p4.markPaid">Mark paid</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="hr-form-2col">
        <div class="form-group"><label class="form-label" for="pr-run" data-i18n="hr.p4.run">Pay run</label>
          <select class="form-control" id="pr-run" dir="ltr"></select></div>
        <div class="form-group"><label class="form-label" data-i18n="common.status">Status</label>
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
            <span id="pr-status"></span>
            <span style="font-size:12.5px" dir="ltr" id="pr-month"></span>
            <span style="font-size:12.5px"><span data-i18n="hr.p4.paidOn">Paid on</span>: <span dir="ltr" id="pr-paidon">—</span></span>
          </div></div>
      </div>
      <div class="hr-note" id="pr-lock" data-i18n="hr.p4.locked">Approved/paid runs are locked.</div>
    </div>
  </div>

  <div class="hr-stat-cards">
    <div class="hr-stat"><div class="k" data-i18n="hr.p4.gross">Gross</div><div class="v" id="pr-stat-gross">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="hr.p4.gosiEmp">GOSI employee</div><div class="v" id="pr-stat-gosi">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="hr.p4.deductions">Deductions</div><div class="v" id="pr-stat-ded">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="hr.p4.net">Net payable</div><div class="v" id="pr-stat-net">0</div></div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table hr-table">
          <thead><tr>
            <th data-i18n="hr.p4.employee">Employee</th>
            <th data-i18n="hr.p4.wage">Wage</th>
            <th data-i18n="hr.payroll.ot">OT</th>
            <th data-i18n="hr.p4.extras">Extras</th>
            <th data-i18n="hr.p4.gross">Gross</th>
            <th data-i18n="hr.payroll.gosi">GOSI</th>
            <th data-i18n="hr.p4.deductions">Deductions</th>
            <th data-i18n="hr.p4.net">Net payable</th>
            <th data-i18n="common.actions">Actions</th>
          </tr></thead>
          <tbody id="pr-rows"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>
</main>

<script type="module">
import { initPayroll } from '/src/v4/payroll.js';
initPayroll();
</script>

</body>
</html>
