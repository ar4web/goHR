<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="nav.hr-reports">Reports | HRGO</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="hr-reports" data-breadcrumb="Home > Reports">

<main class="main">
<div class="page-wrapper" data-hr-reports>

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle" data-i18n="hr.ui.pretitle">HR &amp; Operations</div>
        <h1 class="page-title" data-i18n="nav.hr-reports">Reports</h1>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2 data-i18n="hr.p6.workforce">Workforce</h2>
      <div class="page-actions">
        <button class="btn btn-outline btn-sm" id="rp-emp-xlsx">Excel</button>
        <button class="btn btn-outline btn-sm" id="rp-emp-csv">CSV</button>
      </div>
    </div>
    <div class="card-body"><div class="hr-kpi-grid" id="rp-workforce"></div></div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2 data-i18n="hr.p6.funnel">Hiring funnel</h2>
      <div class="page-actions">
        <button class="btn btn-outline btn-sm" id="rp-hire-xlsx">Excel</button>
        <button class="btn btn-outline btn-sm" id="rp-hire-csv">CSV</button>
      </div>
    </div>
    <div class="card-body" id="rp-funnel"></div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2 data-i18n="hr.p6.financePack">Finance pack</h2>
      <div class="page-actions">
        <button class="btn btn-outline btn-sm" id="rp-fin-xlsx">Excel</button>
        <button class="btn btn-outline btn-sm" id="rp-fin-csv">CSV</button>
      </div>
    </div>
    <div class="card-body"><div class="hr-kpi-grid" id="rp-finance"></div></div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2 data-i18n="hr.p6.billing">Billing</h2>
      <div class="page-actions">
        <button class="btn btn-outline btn-sm" id="rp-inv-xlsx">Excel</button>
        <button class="btn btn-outline btn-sm" id="rp-inv-csv">CSV</button>
      </div>
    </div>
    <div class="card-body">
      <div class="hr-kpi-grid" style="margin-bottom:12px">
        <div class="hr-kpi"><div class="hr-kpi-v" dir="ltr" id="rp-bill-total">0</div><div class="hr-kpi-l" data-i18n="hr.p3.total">Total</div></div>
        <div class="hr-kpi"><div class="hr-kpi-v" dir="ltr" id="rp-bill-out">0</div><div class="hr-kpi-l" data-i18n="hr.p6.totalOut">Outstanding total</div></div>
      </div>
      <div class="table-responsive">
        <table class="table hr-table">
          <thead><tr>
            <th>#</th>
            <th data-i18n="hr.p6.client">Client</th>
            <th data-i18n="hr.p6.month">Month</th>
            <th data-i18n="hr.p3.total">Total</th>
            <th data-i18n="hr.p6.outstanding">Outstanding</th>
            <th data-i18n="common.status">Status</th>
          </tr></thead>
          <tbody id="rp-billing"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2><span data-i18n="hr.p6.compliance">Compliance expiries</span> (<span id="rp-comp-count">0</span>)</h2>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table hr-table">
          <thead><tr>
            <th data-i18n="hr.p5.type">Type</th>
            <th data-i18n="hr.p6.code">Ref</th>
            <th data-i18n="hr.p6.date">Expiry</th>
            <th data-i18n="hr.p6.daysLeft">Days left</th>
          </tr></thead>
          <tbody id="rp-compliance"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>
</main>

<script type="module">
import { initReports } from '/src/v4/reports.js';
initReports();
</script>

</body>
</html>
