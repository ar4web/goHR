<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="nav.hr-assignments">Assignments | HRGO</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="assignments" data-breadcrumb="Home > Assignments">

<main class="main">
<div class="page-wrapper" data-hr-assign>

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle" data-i18n="hr.ui.pretitle">HR &amp; Operations</div>
        <h1 class="page-title" data-i18n="nav.hr-assignments">Assignments</h1>
      </div>
      <div class="page-actions">
        <button class="btn btn-outline" id="as-import" data-i18n="common.import">Import</button>
        <button class="btn btn-outline" id="as-export" data-i18n="common.export">Export</button>
        <button class="btn btn-primary" id="as-new" data-i18n="hr.p3.deploy">Deploy</button>
      </div>
    </div>
  </div>

  <div class="hr-stat-cards">
    <div class="hr-stat"><div class="k" data-i18n="common.active">Active</div><div class="v" id="as-stat-active">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="status.blocked">Blocked</div><div class="v" id="as-stat-blocked">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="status.expiring">Expiring</div><div class="v" id="as-stat-expiring">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="status.returned">Returned</div><div class="v" id="as-stat-returned">0</div></div>
  </div>

  <div class="hr-controls">
    <select class="form-control" id="as-client" aria-label="Client"></select>
    <select class="form-control" id="as-gate" aria-label="Gate"></select>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table hr-table">
          <thead><tr>
            <th data-i18n="hr.p2.worker">Worker</th>
            <th data-i18n="hr.p3.client">Client</th>
            <th data-i18n="hr.p3.period">Period</th>
            <th data-i18n="hr.p3.rate">Rate</th>
            <th data-i18n="hr.p3.ajeer">Ajeer</th>
            <th data-i18n="hr.p3.gate">Gate</th>
            <th data-i18n="common.actions">Actions</th>
          </tr></thead>
          <tbody id="as-rows"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>
</main>

<script type="module">
import { initAssignments } from '/src/v4/assignments.js';
initAssignments();
</script>

</body>
</html>
