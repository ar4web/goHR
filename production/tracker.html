<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="nav.hr-tracker">Workforce tracker | HRGO</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="tracker" data-breadcrumb="Home > Workforce tracker">

<main class="main">
<div class="page-wrapper" data-hr-tracker>

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle" data-i18n="hr.ui.pretitle">HR &amp; Operations</div>
        <h1 class="page-title" data-i18n="hr.nav.tracker">Workforce tracker</h1>
      </div>
      <div class="page-actions">
        <span style="align-self:center;font-size:12.5px;color:var(--text-muted)" id="track-count"></span>
        <button class="btn btn-primary" id="track-export" data-i18n="common.export">Export</button>
      </div>
    </div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-header"><div class="card-title" data-i18n="hr.tracker.pipeline">In pipeline</div></div>
    <div class="card-body" id="track-pipe"></div>
  </div>

  <div class="card">
    <div class="card-header" style="gap:12px;flex-wrap:wrap">
      <div class="card-title" data-i18n="hr.tracker.board">Board</div>
      <div class="card-options">
        <div class="search-box" style="width:240px">
          <svg class="s-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
          <input type="text" id="track-search" data-i18n-ph="common.search" placeholder="Search" aria-label="Search tracker">
        </div>
      </div>
    </div>
    <div class="card-body">
      <div class="track-board" id="track-board"></div>
    </div>
  </div>

</div>
</main>

<script type="module">
import { initTracker } from '/src/v4/tracker.js';
initTracker();
</script>

</body>
</html>
