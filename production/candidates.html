<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="nav.hr-candidates">Candidates | HRGO</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="candidates" data-breadcrumb="Home > Candidates">

<main class="main">
<div class="page-wrapper" data-hr-candidates>

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle" data-i18n="hr.ui.pretitle">HR &amp; Operations</div>
        <h1 class="page-title" data-i18n="nav.hr-candidates">Candidates</h1>
      </div>
      <div class="page-actions">
        <button class="btn btn-outline" id="cd-export-xlsx">Excel</button>
        <button class="btn btn-outline" id="cd-export-csv">CSV</button>
        <button class="btn btn-outline" id="cd-import" data-i18n="common.import">Import</button>
        <button class="btn btn-primary" id="cd-new" data-i18n="hr.p5.newCand">New candidate</button>
      </div>
    </div>
  </div>

  <div class="hr-stat-cards">
    <div class="hr-stat"><div class="k" data-i18n="hr.p5.all">All</div><div class="v" id="cd-stat-all">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="hr.p5.inProcess">In process</div><div class="v" id="cd-stat-proc">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="hr.p5.hired">Hired</div><div class="v" id="cd-stat-hired">0</div></div>
    <div class="hr-stat"><div class="k" data-i18n="status.rejected">Rejected</div><div class="v" id="cd-stat-rej">0</div></div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="hr-form-2col">
        <div class="form-group"><label class="form-label" for="cd-job" data-i18n="hr.p5.job">Job</label>
          <select class="form-control" id="cd-job"></select></div>
        <div class="form-group"><label class="form-label" for="cd-stage" data-i18n="hr.p5.stage">Stage</label>
          <select class="form-control" id="cd-stage">
            <option value="all" data-i18n="hr.p5.all">All</option>
            <option value="new" data-i18n="hr.stages.new">New</option>
            <option value="screening" data-i18n="hr.stages.screening">Screening</option>
            <option value="interview" data-i18n="hr.stages.interview">Interview</option>
            <option value="offer" data-i18n="hr.stages.offer">Offer</option>
            <option value="hired" data-i18n="hr.stages.hired">Hired</option>
            <option value="rejected" data-i18n="hr.stages.rejected">Rejected</option>
          </select></div>
      </div>
      <div class="table-responsive">
        <table class="table hr-table">
          <thead><tr>
            <th>#</th>
            <th data-i18n="hr.p5.name">Name</th>
            <th data-i18n="hr.p5.nationality">Nationality</th>
            <th data-i18n="hr.p5.job">Job</th>
            <th data-i18n="hr.p5.source">Source</th>
            <th data-i18n="hr.p5.stage">Stage</th>
            <th data-i18n="common.actions">Actions</th>
          </tr></thead>
          <tbody id="cd-rows"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>
</main>

<script type="module">
import { initCandidates } from '/src/v4/candidates.js';
initCandidates();
</script>

</body>
</html>
