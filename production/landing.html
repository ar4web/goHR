<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="common.gatewayTitle">Who is signing in?</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body>

<div class="auth-page" data-gateway>
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-icon" id="gw-logo">D</div>
      <div class="brand-name" id="gw-name">Dash</div>
    </div>

    <div class="auth-title" data-i18n="common.gatewayTitle">Who is signing in?</div>
    <div class="auth-subtitle" data-i18n="common.gatewaySub">Pick your role to enter. No passwords on this device — access is granted by your administrator.</div>

    <div class="gw-lang" id="gw-lang"></div>
    <div class="gw-grid" id="gw-roles"></div>

    <p class="gw-hint" data-i18n="common.gatewayHint">You can switch roles anytime from Roles &amp; access.</p>
    <div class="auth-divider" data-i18n="common.gatewayFoot">Internal tool · Single-device preview</div>
  </div>
</div>

<script type="module">
import { initGateway } from '/src/v4/gateway.js';
initGateway();
</script>

</body>
</html>
