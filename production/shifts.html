<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="nav.hr-shifts">Shifts | HRGO</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>
<script type="module" src="/src/main-v4.js"></script>
</head>
<body data-shell="admin" data-page="shifts" data-breadcrumb="Home > Shifts">

<main class="main">
<div class="page-wrapper" data-hr-shifts>

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle" data-i18n="hr.ui.pretitle">HR &amp; Operations</div>
        <h1 class="page-title" data-i18n="nav.hr-shifts">Shifts</h1>
      </div>
      <div class="page-actions">
        <button class="btn btn-outline" id="shift-import" data-i18n="common.import">Import</button>
        <button class="btn btn-outline" id="shift-export" data-i18n="common.export">Export</button>
      </div>
    </div>
  </div>

  <div id="shift-banner" style="margin-bottom:14px"></div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-header"><div class="card-title" data-i18n="hr.p2.templates">Shift templates</div></div>
    <div class="card-body" id="shift-cards"></div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-header"><div class="card-title" data-i18n="hr.p2.siteMapping">Site mapping</div></div>
    <div class="card-body" id="shift-sites"></div>
  </div>

  <div class="card">
    <div class="card-header"><div class="card-title" data-i18n="hr.p2.ramadan">Ramadan schedule</div></div>
    <div class="card-body" id="shift-ramadan"></div>
  </div>

</div>
</main>

<script type="module">
import { initShifts } from '/src/v4/shifts.js';
initShifts();
</script>

</body>
</html>
