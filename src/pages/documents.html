<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="nav.documents">Documents | goHR</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<script type="module" src="/src/main.js"></script>
</head>
<body data-shell="admin" data-page="documents" data-breadcrumb="Home > Documents">

<main class="main">
<div class="page-wrapper" data-hr-docs>

  <div class="page-header">
    <div class="page-header-row">
      <div>
        <div class="page-pretitle" data-i18n="hr.ui.pretitle">HR &amp; Operations</div>
        <h1 class="page-title" data-i18n="nav.documents">Documents</h1>
      </div>
      <div class="page-header-actions">
        <button class="btn btn-primary btn-sm" id="dc-new-tpl" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 5v14M5 12h14"/></svg> <span data-i18n="doc.newTemplate">New template</span></button>
        <button class="btn btn-outline btn-sm" id="dc-letterhead" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 15h6"/></svg> <span data-i18n="doc.letterhead">Letterhead</span></button>
      </div>
    </div>
  </div>

  <!-- TABS -->
  <div class="inv-tabs" role="tablist">
    <button class="inv-tab active" data-tab="templates" role="tab" aria-selected="true" type="button"><span data-i18n="doc.tabTemplates">Templates</span> <span class="inv-tab-badge" id="dc-tabcount-tpl"></span></button>
    <button class="inv-tab" data-tab="issued" role="tab" aria-selected="false" type="button"><span data-i18n="doc.tabIssued">Issued</span> <span class="inv-tab-badge" id="dc-tabcount-iss"></span></button>
  </div>

  <!-- ══ TAB: TEMPLATES ══ -->
  <section data-tabpanel="templates">
    <div class="dc-cat-row" role="toolbar" aria-label="Categories">
      <button class="dc-cat-chip active" data-dc-cat="" type="button" data-i18n="doc.catAll">All</button>
      <button class="dc-cat-chip" data-dc-cat="hr" type="button" data-i18n="doc.catHr">HR letters</button>
      <button class="dc-cat-chip" data-dc-cat="contract" type="button" data-i18n="doc.catContract">Contracts</button>
      <button class="dc-cat-chip" data-dc-cat="agreement" type="button" data-i18n="doc.catAgreement">Agreements</button>
      <button class="dc-cat-chip" data-dc-cat="notice" type="button" data-i18n="doc.catNotice">Notices</button>
      <button class="dc-cat-chip" data-dc-cat="custom" type="button" data-i18n="doc.catCustom">Custom</button>
    </div>
    <div class="tpl-grid" id="dc-tpl-grid"></div>
  </section>

  <!-- ══ TAB: ISSUED ══ -->
  <section data-tabpanel="issued" hidden>
    <div class="card emp-toolbar">
      <div class="card-body emp-toolbar-row">
        <div class="emp-toolbar-left"><span class="caption-muted" id="dc-count"></span></div>
        <div class="emp-toolbar-right">
          <button class="btn btn-ghost btn-sm" id="dc-export" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 15V3m0 0l-4 4m4-4l4 4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg> <span data-i18n="doc.exportExcel">Export Excel</span></button>
        </div>
      </div>
    </div>
    <div class="card emp-table-card">
      <div class="card-body p-0 emp-table-wrap">
        <div class="table-responsive">
          <table class="table emp-table" data-page-length="10">
            <thead>
              <tr>
                <th data-i18n="doc.hNo">No.</th>
                <th data-i18n="doc.hDate">Date</th>
                <th data-i18n="doc.hTitle">Document</th>
                <th data-i18n="doc.hTpl">Template</th>
                <th data-i18n="doc.hEmp">Employee</th>
                <th data-i18n="doc.hLang">Language</th>
                <th class="emp-actions-col" data-i18n="common.actions">Actions</th>
              </tr>
            </thead>
            <tbody id="dc-iss-rows"></tbody>
          </table>
        </div>
      </div>
    </div>
  </section>

</div>
</main>

</body>
</html>
